<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="591" viewBox="0 0 1200 591" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<rect width="1200" height="591" fill="#fcfcfb"/>
  <text x="40" y="40" font-size="24.5" font-weight="600" fill="#0b0b0b">Where collective epistemic competence breaks down</text>
  <text x="40" y="66" font-size="17.4" fill="#52514e">The intended pipeline, and what Observer Zero finds at each link. An arrow reaching the next stage</text>
  <text x="40" y="88" font-size="17.4" fill="#52514e">carries information; an arrow stopped by a bar does not.</text>
  <rect x="36.0" y="112" width="158.0" height="96" rx="8" fill="none" stroke="#898781" stroke-width="1.5"/>
  <text x="115.0" y="145" font-size="14.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">WORLD</text>
  <text x="115.0" y="170" font-size="13.0" fill="#52514e" text-anchor="middle">g = 14.20 → 13.97,</text>
  <text x="115.0" y="188" font-size="13.0" fill="#52514e" text-anchor="middle">silently, on day 12</text>
  <rect x="228.8" y="112" width="158.0" height="96" rx="8" fill="none" stroke="#898781" stroke-width="1.5"/>
  <text x="307.8" y="145" font-size="14.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">MEASUREMENT</text>
  <text x="307.8" y="170" font-size="13.0" fill="#52514e" text-anchor="middle">agents choose what,</text>
  <text x="307.8" y="188" font-size="13.0" fill="#52514e" text-anchor="middle">when and how often</text>
  <rect x="421.6" y="112" width="158.0" height="96" rx="8" fill="none" stroke="#898781" stroke-width="1.5"/>
  <text x="500.6" y="145" font-size="14.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">EVIDENCE</text>
  <text x="500.6" y="170" font-size="13.0" fill="#52514e" text-anchor="middle">what is actually in</text>
  <text x="500.6" y="188" font-size="13.0" fill="#52514e" text-anchor="middle">the agent's notebook</text>
  <rect x="614.4" y="112" width="158.0" height="96" rx="8" fill="none" stroke="#898781" stroke-width="1.5"/>
  <text x="693.4" y="145" font-size="14.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">BELIEF</text>
  <text x="693.4" y="170" font-size="13.0" fill="#52514e" text-anchor="middle">explicit hypotheses</text>
  <text x="693.4" y="188" font-size="13.0" fill="#52514e" text-anchor="middle">and probabilities</text>
  <rect x="807.2" y="112" width="158.0" height="96" rx="8" fill="none" stroke="#898781" stroke-width="1.5"/>
  <text x="886.2" y="145" font-size="14.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">COMMUNICATION</text>
  <text x="886.2" y="170" font-size="13.0" fill="#52514e" text-anchor="middle">voluntary letters;</text>
  <text x="886.2" y="188" font-size="13.0" fill="#52514e" text-anchor="middle">nothing is scheduled</text>
  <rect x="1000.0" y="112" width="158.0" height="96" rx="8" fill="none" stroke="#898781" stroke-width="1.5"/>
  <text x="1079.0" y="142" font-size="14.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">COLLECTIVE</text>
  <text x="1079.0" y="160" font-size="14.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">BELIEF</text>
  <text x="1079.0" y="184" font-size="13.0" fill="#52514e" text-anchor="middle">what the society holds</text>
  <line x1="199.0" y1="160.0" x2="220.0" y2="160.0" stroke="#2a78d6" stroke-width="2"/>
  <path d="M227.0 160.0 l-8 -5 v10 z" fill="#2a78d6"/>
  <text x="209.5" y="103" font-size="14.5" font-weight="600" fill="#2a78d6" text-anchor="middle">1</text>
  <line x1="391.8" y1="160.0" x2="412.8" y2="160.0" stroke="#2a78d6" stroke-width="2"/>
  <path d="M419.8 160.0 l-8 -5 v10 z" fill="#2a78d6"/>
  <text x="402.3" y="103" font-size="14.5" font-weight="600" fill="#2a78d6" text-anchor="middle">2</text>
  <line x1="584.6" y1="160.0" x2="605.6" y2="160.0" stroke="#eb6834" stroke-width="2"/>
  <line x1="609.6" y1="150.0" x2="609.6" y2="170.0" stroke="#eb6834" stroke-width="3"/>
  <text x="595.1" y="103" font-size="14.5" font-weight="600" fill="#eb6834" text-anchor="middle">3</text>
  <line x1="777.4" y1="160.0" x2="798.4" y2="160.0" stroke="#eb6834" stroke-width="2"/>
  <line x1="802.4" y1="150.0" x2="802.4" y2="170.0" stroke="#eb6834" stroke-width="3"/>
  <text x="787.9" y="103" font-size="14.5" font-weight="600" fill="#eb6834" text-anchor="middle">4</text>
  <line x1="970.2" y1="151.0" x2="991.2" y2="151.0" stroke="#eb6834" stroke-width="2"/>
  <line x1="995.2" y1="141.0" x2="995.2" y2="161.0" stroke="#eb6834" stroke-width="3"/>
  <line x1="970.2" y1="169.0" x2="991.2" y2="169.0" stroke="#2a78d6" stroke-width="2"/>
  <path d="M998.2 169.0 l-8 -5 v10 z" fill="#2a78d6"/>
  <text x="980.7" y="103" font-size="14.5" font-weight="600" fill="#eb6834" text-anchor="middle">5</text>
  <line x1="40" y1="242" x2="1158" y2="242" stroke="#e2e0dc" stroke-width="1"/>
  <text x="40" y="270.0" font-size="16.5" font-weight="600" fill="#2a78d6">1 · INTACT</text>
  <text x="185" y="270.0" font-size="16.0" fill="#52514e"><tspan font-weight="600" fill="#0b0b0b">They measured well.</tspan> At n = 8 the societies' own measurement choices supported a stronger signal than a fixed</text>
  <text x="185" y="291.0" font-size="16.0" fill="#52514e">reference schedule covering every instrument in the world six times daily (policy gap −0.95 to −1.19).</text>
  <text x="40" y="329.0" font-size="16.5" font-weight="600" fill="#2a78d6">2 · INTACT</text>
  <text x="185" y="329.0" font-size="16.0" fill="#52514e"><tspan font-weight="600" fill="#0b0b0b">The evidence was there.</tspan> A non-LLM change-point detector, given only the agents' own measurements and no world</text>
  <text x="185" y="350.0" font-size="16.0" fill="#52514e">parameters, found the shift in 40 of 40 runs at n = 8. Signal rises from |z| ≈ 3.3 to ≈ 7.5 across the programme.</text>
  <text x="40" y="388.0" font-size="16.5" font-weight="600" fill="#eb6834">3 · SEVERED</text>
  <text x="185" y="388.0" font-size="16.0" fill="#52514e"><tspan font-weight="600" fill="#0b0b0b">They did not conclude it.</tspan> One agent of 276 concluded that a physical law had changed. The rate does not move</text>
  <text x="185" y="409.0" font-size="16.0" fill="#52514e">anywhere on the evidence gradient, and it survives scale, institution, composition and a prompt ablation.</text>
  <text x="40" y="447.0" font-size="16.5" font-weight="600" fill="#eb6834">4 · ABSENT</text>
  <text x="185" y="447.0" font-size="16.0" fill="#52514e"><tspan font-weight="600" fill="#0b0b0b">Nobody spoke first.</tspan> Across 6,880 agent-days of voluntary communication opportunity, homogeneous grounded</text>
  <text x="185" y="468.0" font-size="16.0" fill="#52514e">societies produced zero voluntary communications — at two society sizes, with and without a public institution.</text>
  <text x="40" y="506.0" font-size="16.5" font-weight="600" fill="#eb6834">5 · SELECTIVE</text>
  <text x="185" y="506.0" font-size="16.0" fill="#52514e"><tspan font-weight="600" fill="#0b0b0b">Structure did not cross; unsupported claims did.</tspan> Adding one communicative agent produced a star, not a cascade</text>
  <text x="185" y="527.0" font-size="16.0" fill="#52514e">— no grounded agent in the mixed arms ever initiated, and cascade depth was exactly 1.000 in every run. Yet of twenty</text>
  <text x="185" y="548.0" font-size="16.0" fill="#52514e">unsupported claims delivered by that agent, eighteen were incorporated into a grounded agent's beliefs and none</text>
  <text x="185" y="569.0" font-size="16.0" fill="#52514e">challenged.</text>
</svg>
