<svg xmlns="http://www.w3.org/2000/svg" width="860" height="452" viewBox="0 0 860 452" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="860" height="452" fill="#fcfcfb"/>
  <text x="24" y="34" font-size="16" font-weight="600" fill="#0b0b0b">The Observer Zero paradigm</text>
  <text x="24" y="54" font-size="12" fill="#52514e">The experimenter holds perfect ground truth; the agents hold only observations, memories, and each other.</text>

  <!-- Simulator layer -->
  <rect x="180" y="76" width="500" height="52" rx="8" fill="none" stroke="#0b0b0b" stroke-width="1.5"/>
  <text x="430" y="98" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">SIMULATOR – holds ground truth</text>
  <text x="430" y="116" font-size="11" fill="#52514e" text-anchor="middle">g = 14.20 → secretly 13.97 on day 12 · instrument faults · seeded noise</text>

  <line x1="430" y1="128" x2="430" y2="152" stroke="#898781" stroke-width="1.5"/>
  <path d="M430 152 l-4 -7 h8 z" fill="#898781"/>

  <!-- World layer -->
  <rect x="180" y="154" width="500" height="52" rx="8" fill="none" stroke="#898781" stroke-width="1.5"/>
  <text x="430" y="176" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">MERIDIAN – hidden laws</text>
  <text x="430" y="194" font-size="11" fill="#52514e" text-anchor="middle">pendulums (feel gravity) · resonators (do not) · two sites</text>

  <!-- observation arrows: from Meridian bottom corners to agent box tops -->
  <line x1="260" y1="206" x2="230" y2="258" stroke="#898781" stroke-width="1.5"/>
  <path d="M230 258 l1 -9 l7 4 z" fill="#898781"/>
  <line x1="600" y1="206" x2="630" y2="258" stroke="#898781" stroke-width="1.5"/>
  <path d="M630 258 l-8 -4 l7 -5 z" fill="#898781"/>
  <text x="430" y="228" font-size="11" fill="#898781" text-anchor="middle">observations only</text>
  <text x="430" y="243" font-size="11" fill="#898781" text-anchor="middle">(each agent sees just its own instruments)</text>

  <!-- Agents -->
  <rect x="120" y="262" width="220" height="72" rx="8" fill="none" stroke="#2a78d6" stroke-width="2"/>
  <text x="230" y="286" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">ADA – laboratory</text>
  <text x="230" y="304" font-size="11" fill="#52514e" text-anchor="middle">experiments · notebook · memory</text>
  <text x="230" y="320" font-size="11" fill="#52514e" text-anchor="middle">explicit hypotheses + probabilities</text>

  <rect x="520" y="262" width="220" height="72" rx="8" fill="none" stroke="#eb6834" stroke-width="2"/>
  <text x="630" y="286" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">MAYA – observatory</text>
  <text x="630" y="304" font-size="11" fill="#52514e" text-anchor="middle">experiments · notebook · memory</text>
  <text x="630" y="320" font-size="11" fill="#52514e" text-anchor="middle">explicit hypotheses + probabilities</text>

  <!-- message channel -->
  <line x1="344" y1="302" x2="516" y2="302" stroke="#52514e" stroke-width="1.5"/>
  <path d="M516 302 l-8 -4 v8 z" fill="#52514e"/>
  <path d="M344 302 l8 -4 v8 z" fill="#52514e"/>
  <text x="430" y="294" font-size="11" fill="#52514e" text-anchor="middle">messages</text>

  <!-- evaluation layer -->
  <line x1="230" y1="334" x2="230" y2="364" stroke="#898781" stroke-width="1.5"/>
  <line x1="630" y1="334" x2="630" y2="364" stroke="#898781" stroke-width="1.5"/>
  <rect x="90" y="366" width="680" height="64" rx="8" fill="none" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="430" y="388" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">EVALUATION – outside the world</text>
  <text x="430" y="405" font-size="11" fill="#52514e" text-anchor="middle">every observation, message, and belief logged</text>
  <text x="430" y="420" font-size="11" fill="#52514e" text-anchor="middle">beliefs scored against ground truth · evidence claims traced or exposed</text>

  <!-- side annotation -->
  <text x="836" y="100" font-size="10" fill="#898781" text-anchor="end">known</text>
  <text x="836" y="178" font-size="10" fill="#898781" text-anchor="end">hidden</text>
  <text x="836" y="300" font-size="10" fill="#898781" text-anchor="end">logged</text>
  <text x="836" y="396" font-size="10" fill="#898781" text-anchor="end">scored</text>
</svg>
